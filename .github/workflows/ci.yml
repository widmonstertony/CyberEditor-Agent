name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standard-library-tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Compile sources
        run: python -m compileall -q main.py src tests

      - name: Run unit and mocked integration tests
        run: python -m unittest discover -s tests -v

  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: standard-library-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate browser demo JavaScript
        run: node --check web/app.js
      - name: Package control plane
        run: |
          mkdir -p release/app
          cp control_plane.py release/app/
          cp -a src release/app/src
          cp -a web release/app/web
          printf '%s\n' "$GITHUB_SHA" > release/.deploy-commit
          tar -C release -czf cybereditor-control.tgz .
      - name: Upload control plane
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cybereditor-${{ github.sha }}
          path: cybereditor-control.tgz
          if-no-files-found: error
          retention-days: 7

  deploy-control-plane:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: [self-hosted, production, cybereditor]
    environment:
      name: production
      url: https://tonytan.me/cybereditor/?demo=1
    steps:
      - name: Download control plane
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cybereditor-${{ github.sha }}
      - name: Deploy reviewed control plane
        run: sudo /usr/local/sbin/deploy-cybereditor-control < cybereditor-control.tgz
      - name: Verify public source demo
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors 'https://tonytan.me/cybereditor/?demo=1' >/dev/null
